server:
  port: ${PORT:8080}

spring:
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/triage
    username: ${DB_USERNAME:signal}
    password: ${DB_PASSWORD:signal}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      initialization-fail-timeout: -1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:signal-512204}

signal:
  jwt:
    secret: ${SIGNAL_JWT_SECRET:super_secret_key_for_signal_backend_development_must_be_32_bytes_long}
  pubsub:
    scored-items-subscription: signal-triage-consumer

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
