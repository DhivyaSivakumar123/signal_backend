server:
  port: ${PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:signal-512204}
    gateway:
      routes:
        - id: auth-route
          uri: ${AUTH_SERVICE_URL:https://auth-service-871301543752.us-central1.run.app}
          predicates:
            - Path=/api/auth/**, /api/me, /oauth2/**
        - id: integration-route
          uri: ${INTEGRATION_SERVICE_URL:https://integration-service-871301543752.us-central1.run.app}
          predicates:
            - Path=/api/integrations/**
        - id: triage-route
          uri: ${TRIAGE_SERVICE_URL:https://triage-service-871301543752.us-central1.run.app}
          predicates:
            - Path=/api/triage/**
        - id: analytics-route
          uri: ${ANALYTICS_SERVICE_URL:https://analytics-service-871301543752.us-central1.run.app}
          predicates:
            - Path=/api/analytics/**

signal:
  jwt:
    secret: ${SIGNAL_JWT_SECRET:super_secret_key_for_signal_backend_development_must_be_32_bytes_long}

management:
  endpoints:
    web:
      exposure:
        include: health,info
