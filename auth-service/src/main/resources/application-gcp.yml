server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/auth
    username: ${DB_USERNAME:signal}
    password: ${DB_PASSWORD:signal}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      initialization-fail-timeout: -1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:signal-512204}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            redirect-uri: "https://gateway-service-871301543752.us-central1.run.app/oauth2/callback/google"

signal:
  frontend-url: ${SIGNAL_FRONTEND_URL:https://signal-mocha-nine.vercel.app}
  jwt:
    secret: ${SIGNAL_JWT_SECRET:super_secret_key_for_signal_backend_development_must_be_32_bytes_long}

management:
  endpoints:
    web:
      exposure:
        include: health,info
