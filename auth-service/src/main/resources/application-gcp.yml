spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/auth
    username: signal
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://gateway-service-871301543752.us-central1.run.app/oauth2/callback/google"

signal:
  frontend-url: ${SIGNAL_FRONTEND_URL:https://signal-mocha-nine.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
