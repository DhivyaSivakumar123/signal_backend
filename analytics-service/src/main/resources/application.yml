server:
  port: 8085

spring:
  application:
    name: analytics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signal_db?currentSchema=analytics}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: analytics
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: dummy-access-key
        secret-key: dummy-secret-key
      sqs:
        endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://localhost:4566}

management:
  endpoints:
    web:
      exposure:
        include: health
