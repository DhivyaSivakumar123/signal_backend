version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: signal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8.0
    container_name: signal-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=${SPRING_CLOUD_AWS_REGION_STATIC:-us-east-1}
    volumes:
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -q '\"sqs\":\\s*\"\\(running\\|available\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}&currentSchema=gateway
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - INTEGRATION_SERVICE_URL=http://integration-service:8082
      - TRIAGE_SERVICE_URL=http://triage-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8085
    depends_on:
      - auth-service
      - integration-service
      - triage-service
      - analytics-service

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}&currentSchema=auth
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI}
      - SIGNAL_FRONTEND_URL=${SIGNAL_FRONTEND_URL:-http://localhost:4200}
      - SIGNAL_AUTH_DEV_LOGIN_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy

  integration-service:
    build: ./integration-service
    container_name: integration-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}&currentSchema=integration
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:-test}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:-test}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SPRING_CLOUD_AWS_REGION_STATIC:-us-east-1}
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
      - SIGNAL_ENCRYPTION_KEY=${SIGNAL_ENCRYPTION_KEY:-signal_development_default_aes_256_encryption_key_change_in_prod}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SLACK_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SLACK_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SLACK_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SLACK_CLIENT_SECRET}
      - SIGNAL_FRONTEND_URL=${SIGNAL_FRONTEND_URL:-http://localhost:4200}
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  scoring-service:
    build: ./scoring-service
    container_name: scoring-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}&currentSchema=scoring
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:-test}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:-test}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SPRING_CLOUD_AWS_REGION_STATIC:-us-east-1}
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
      - SIGNAL_SCORING_PROVIDER=${SIGNAL_SCORING_PROVIDER:-mock}
      - SIGNAL_SCORING_OPENAI_API_KEY=${SIGNAL_SCORING_OPENAI_API_KEY}
      - SIGNAL_SCORING_CLAUDE_API_KEY=${SIGNAL_SCORING_CLAUDE_API_KEY}
      - SIGNAL_SCORING_GROQ_API_KEY=${SIGNAL_SCORING_GROQ_API_KEY}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TRIAGE_SERVICE_URL=http://triage-service:8084
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  triage-service:
    build: ./triage-service
    container_name: triage-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}&currentSchema=triage
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:-test}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:-test}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SPRING_CLOUD_AWS_REGION_STATIC:-us-east-1}
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - TZ=Asia/Kolkata
    depends_on:
      localstack:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}&currentSchema=analytics
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:-test}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:-test}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SPRING_CLOUD_AWS_REGION_STATIC:-us-east-1}
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
    depends_on:
      localstack:
        condition: service_healthy
